{% extends "layout.html" %}
{% block content %}
  <article class="content-section py-4 px-4 px-md-5 mb-4">
    <div class="d-flex align-items-start gap-3 gap-md-4">
      <img class="article-img flex-shrink-0"
           src="{{ post.author.image_path }}"
           alt="{{ post.author.username }}'s profile picture"
           width="68"
           height="68"
           loading="lazy">

      <div class="flex-grow-1">
        <div class="article-metadata mb-2">
          <a class="me-2" href="{{ url_for('user_posts', user_id=post.author.id) }}">
            {{ post.author.username }}
          </a>
          <small class="text-body-secondary">
            {{ post.date_posted.strftime("%B %d, %Y") }}
          </small>
        </div>

        <h2 class="article-title mb-3">{{ post.title }}</h2>

        <p class="article-content mb-0">{{ post.content }}</p>

        <!-- Only show edit/delete options if the user is the author -->
        <!-- TODO: Add user authentication and authorization -->
        <div class="post-actions mt-4 pt-3 border-top">
          <a class="btn btn-outline-secondary me-2" href="#">Edit Post</a>
          <button type="button"
                  class="btn btn-outline-danger"
                  data-bs-toggle="modal"
                  data-bs-target="#deleteModal">
            Delete Post
          </button>
        </div>
        <!-- TODO: Add user authentication and authorization -->
      </div>
    </div>
  </article>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade"
       id="deleteModal"
       tabindex="-1"
       aria-labelledby="deleteModalLabel"
       aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-danger">
          <h5 class="modal-title" id="deleteModalLabel">Delete Post?</h5>
          <button type="button"
                  class="btn-close btn-close-white"
                  data-bs-dismiss="modal"
                  aria-label="Close"></button>
        </div>

        <!-- TODO: <form action="#" method="post"> -->
        <form action="#">
          <div class="modal-body py-4">
            Are you sure you want to delete this post?<br>
            <span class="text-body-secondary small">This action cannot be undone.</span>
          </div>
          <div class="modal-footer">
            <button type="button"
                    class="btn btn-outline-secondary"
                    data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="submit" class="btn btn-danger">
              Delete
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock content %}
