<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Site Info -->
    {% if title %}
      <title>FastAPI Blog - {{ title }}</title>
    {% else %}
      <title>FastAPI Blog</title>
    {% endif %}
    <meta name="description" content="FastAPI Tutorial">
    <meta name="author" content="Phyo Thant">

    <!-- Open Graph Tags -->
    <meta property="og:title" content="FastAPI Blog">
    <meta property="og:type" content="website">
    <meta property="og:url" content="">
    <meta property="og:image" content="">
    <meta property="og:image:alt" content="">

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Custom Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
          rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <!-- Stylesheet -->
    <link rel="stylesheet" type="text/css" href="{{ url_for("static", path='css/main.css') }}">

    <!-- Theme color -->
    <meta name="theme-color" content="#527c9f">

    <!-- Favicons -->
    <link rel="icon" href="{{ url_for('static', path='icons/icon.ico') }}" sizes="any">
    <link rel="icon" href="{{ url_for('static', path='icons/icon.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', path='icons/icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', path='site.webmanifest') }}">

    <style>
      
      :root {
        --brand: #527c9f;
        --brand-soft: rgba(82, 124, 159, 0.12);
      }

      body {
        font-family: 'Nunito', system-ui, sans-serif;
        background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      }

      [data-bs-theme="dark"] body {
        background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      }

      .navbar {
        backdrop-filter: blur(12px);
        background: rgba(82, 124, 159, 0.92) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        padding-top: 0.7rem;
        padding-bottom: 0.7rem;
      }

      .navbar-brand {
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        letter-spacing: -0.5px;
        font-size: 1.35rem;
      }

      .nav-link {
        font-weight: 500;
        border-radius: 0.5rem;
        padding: 0.4rem 0.9rem !important;
        transition: all 0.2s ease;
      }

      .nav-link:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      .btn-outline-light, .btn-light {
        border-radius: 50rem;
        font-weight: 600;
        padding: 0.4rem 1.15rem;
        transition: all 0.25s ease;
      }

      .btn-outline-light:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
      }

      .btn-light:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      }

      main.container {
        padding-top: 5.5rem;
        padding-bottom: 3rem;
      }

      /* Content area */
      .content-card {
        background: var(--bs-body-bg);
        border-radius: 1.25rem;
        border: 1px solid rgba(0, 0, 0, 0.05);
        box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.08);
        padding: 1.75rem 1.75rem;
        transition: box-shadow 0.3s ease;
      }

      [data-bs-theme="dark"] .content-card {
        border-color: rgba(255, 255, 255, 0.06);
        box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.4);
      }

      /* Sidebar */
      .sidebar-card {
        background: var(--bs-body-bg);
        border-radius: 1.25rem;
        border: 1px solid rgba(0, 0, 0, 0.05);
        box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.08);
        padding: 1.5rem 1.5rem;
        position: sticky;
        top: 5.5rem;
      }

      [data-bs-theme="dark"] .sidebar-card {
        border-color: rgba(255, 255, 255, 0.06);
        box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.4);
      }

      .sidebar-card h3 {
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        font-size: 1.15rem;
        margin-bottom: 0.75rem;
        color: var(--brand);
      }

      .sidebar-card .list-group-item {
        border: none;
        background: transparent;
        padding: 0.65rem 0.85rem;
        border-radius: 0.6rem;
        margin-bottom: 0.25rem;
        font-weight: 500;
        transition: all 0.2s ease;
        cursor: default;
      }

      .sidebar-card .list-group-item:hover {
        background: var(--brand-soft);
        color: var(--brand);
        transform: translateX(4px);
      }

      /* Footer */
      footer {
        background: transparent !important;
        border-top: 1px solid rgba(0, 0, 0, 0.06) !important;
      }

      [data-bs-theme="dark"] footer {
        border-top-color: rgba(255, 255, 255, 0.08) !important;
      }

      /* Theme dropdown polish */
      .dropdown-menu {
        border-radius: 0.9rem;
        border: none;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        padding: 0.4rem;
      }

      .dropdown-item {
        border-radius: 0.55rem;
        font-weight: 500;
        padding: 0.5rem 0.9rem;
      }

      /* Soft fade-in for content */
      @keyframes softFade {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .content-card, .sidebar-card {
        animation: softFade 0.45s ease-out both;
      }

      .sidebar-card {
        animation-delay: 0.08s;
      }
    </style>
  </head>

  <body class="d-flex flex-column min-vh-100">
    <header class="site-header">
      <nav class="navbar navbar-expand-md fixed-top" data-bs-theme="dark">
        <div class="container">
          <a class="navbar-brand me-4" href="{{ url_for("home") }}">FastAPI Blog</a>

          <button class="navbar-toggler"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#navbarToggle"
                  aria-controls="navbarToggle"
                  aria-expanded="false"
                  aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarToggle">
            <div class="navbar-nav me-auto">
              <a class="nav-link active" aria-current="page" href="{{ url_for("home") }}">Home</a>
            </div>

            <!-- Navbar Right Side -->
            <div class="navbar-nav align-items-md-center gap-2">
              <a class="btn btn-outline-light" href="#">Login</a>
              <a class="btn btn-light" href="#">Register</a>

              <div class="nav-item dropdown">
                <a class="nav-link dropdown-toggle px-3"
                   href="#"
                   role="button"
                   id="bd-theme"
                   data-bs-toggle="dropdown"
                   aria-expanded="false">
                  <span id="bd-theme-text">🌗 Auto</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="bd-theme">
                  <li>
                    <button class="dropdown-item" type="button" data-bs-theme-value="light">🌝 Light</button>
                  </li>
                  <li>
                    <button class="dropdown-item" type="button" data-bs-theme-value="dark">🌚 Dark</button>
                  </li>
                  <li>
                    <button class="dropdown-item" type="button" data-bs-theme-value="auto">🌗 Auto</button>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main role="main" class="container">
      <div class="row g-4">
        <!-- Main Content -->
        <div class="col-lg-8">
          <div class="content-card">
            {% block content %}
            {% endblock content %}
          </div>
        </div>

        <!-- Sidebar -->
        <aside class="col-lg-4">
          <div class="sidebar-card">
            <h3>Our Sidebar</h3>
            <p class="text-body-secondary small mb-3">
              You can put any information here you'd like.
            </p>
            <ul class="list-group list-group-flush">
              <li class="list-group-item">Latest Posts</li>
              <li class="list-group-item">Announcements</li>
              <li class="list-group-item">Calendars</li>
              <li class="list-group-item">etc</li>
            </ul>
          </div>
        </aside>
      </div>
    </main>

    <footer class="mt-auto py-4">
      <div class="container text-center">
        <p class="text-body-secondary mb-0 small">
          © <span id="year"></span> Phyo Thant
        </p>
      </div>
    </footer>

    <!-- Set the current year in the footer -->
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

    <!-- Dark Mode Toggle -->
    <script>
      const setTheme = (theme) => {
        if (theme === 'auto') {
          document.documentElement.setAttribute('data-bs-theme',
            window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } else {
          document.documentElement.setAttribute('data-bs-theme', theme);
        }
        localStorage.setItem('theme', theme);

        // Update button text
        const themeText = { light: '🌝 Light', dark: '🌚 Dark', auto: '🌗 Auto' };
        document.getElementById('bd-theme-text').textContent = themeText[theme];
      };

      // Set theme on click
      document.querySelectorAll('[data-bs-theme-value]').forEach(button => {
        button.addEventListener('click', () => setTheme(button.getAttribute('data-bs-theme-value')));
      });

      // Initialize
      setTheme(localStorage.getItem('theme') || 'auto');
    </script>
  </body>
</html>
