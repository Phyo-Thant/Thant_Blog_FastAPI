{% extends "layout.html" %}

{% block content %}
<article class="content-section py-3 px-4 mb-4">
  <div class="d-flex align-items-start gap-4">
    <img class="rounded-circle article-img flex-shrink-0"
         src="{{ post.author.image_path }}"
         alt="{{ post.author.username }}'s profile picture"
         width="64"
         height="64"
         loading="lazy">

    <div class="flex-grow-1">
      <div class="article-metadata mb-2">
        <a class="me-2"
           href="{{ url_for('user_posts', user_id=post.author.id) }}">
          {{ post.author.username }}
        </a>
        <small class="text-body-secondary">
          {{ post.date_posted.strftime("%B %d, %Y") }}
        </small>
      </div>

      <h2 class="article-title">{{ post.title }}</h2>
      <p class="article-content">{{ post.content }}</p>

      <!-- Only show edit/delete options if user_id is 1 (TEMPORARY) -->
      {% if post.user_id == 1 %}
        <div class="post-actions mt-3 pt-3 border-top">
          <button type="button"
                  class="btn btn-outline-secondary me-1"
                  data-bs-toggle="modal"
                  data-bs-target="#editModal">
            Edit Post
          </button>
          <button type="button"
                  class="btn btn-outline-danger"
                  data-bs-toggle="modal"
                  data-bs-target="#deleteModal">
            Delete Post
          </button>
        </div>
      {% endif %}
    </div>
  </div>
</article>
{% endblock content %}

{% block scripts %}
<script type="module">
  import {
    getErrorMessage,
    hideModal,
    showModal,
  } from "/static/js/utils.js";

  const postId = {{ post.id }};

  // ========== Populate Edit Modal when it opens ==========
  const editModal = document.getElementById("editModal");
  if (editModal) {
    editModal.addEventListener("show.bs.modal", () => {
      document.getElementById("editTitle").value = `{{ post.title|e }}`;
      document.getElementById("editContent").value = `{{ post.content|e }}`;
      docu
      document.querySelector('#editPostForm input[name="post_id"]').value = postId;
    });
  }

  // ========== EDIT POST ==========
  const editForm = document.getElementById("editPostForm");
  if (editForm) {
    editForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const formData = new FormData(editForm);
      // We don't need post_id in the body
      formData.delete("post_id");

      try {
        const response = await fetch(`/api/posts/${postId}`, {
          method: "PATCH",
          // Do NOT set Content-Type – browser will set multipart/form-data
          body: formData,
        });

        if (response.ok) {
          document.getElementById("successMessage").textContent =
            "Post updated successfully!";

          hideModal("editModal");
          showModal("successModal");

          document
            .getElementById("successModal")
            .addEventListener(
              "hidden.bs.modal",
              () => window.location.reload(),
              { once: true }
            );
        } else {
          const error = await response.json();
          document.getElementById("errorMessage").textContent =
            getErrorMessage(error);

          hideModal("editModal");
          showModal("errorModal");
        }
      } catch (error) {
        document.getElementById("errorMessage").textContent =
          "Network error. Please check your connection and try again.";
        showModal("errorModal");
      }
    });
  }

  // ========== DELETE POST ==========
  const deleteButton = document.getElementById("confirmDelete");
  if (deleteButton) {
    deleteButton.addEventListener("click", async () => {
      try {
        const response = await fetch(`/api/posts/${postId}`, {
          method: "DELETE",
        });

        if (response.status === 204) {
          window.location.href = "/";
        } else {
          const error = await response.json();
          document.getElementById("errorMessage").textContent =
            getErrorMessage(error);

          hideModal("deleteModal");
          showModal("errorModal");
        }
      } catch (error) {
        document.getElementById("errorMessage").textContent =
          "Network error. Please check your connection and try again.";
        showModal("errorModal");
      }
    });
  }
</script>
{% endblock scripts %}
