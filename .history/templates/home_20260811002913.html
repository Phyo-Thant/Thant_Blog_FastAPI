{% extends "layout.html" %}

{% block content %}
  {% for post in posts %}
    <article class="content-section py-4 px-4 px-md-5 mb-4">
      <div class="d-flex align-items-start gap-3 gap-md-4">
        <!-- Author profile picture -->
        <img class="article-img flex-shrink-0"
             src="{{ post.author.image_path }}"
             alt="{{ post.author.username }}'s profile picture"
             width="68"
             height="68"
             loading="lazy">

        <div class="flex-grow-1">
          <div class="article-metadata mb-2">
            <a class="me-2" href="{{ url_for('user_posts', user_id=post.author.id) }}">
              {{ post.author.username }}
            </a>
            <small class="text-body-secondary">
              {{ post.date_posted.strftime("%B %d, %Y") }}
            </small>
          </div>

          <h2 class="mb-2">
            <a class="article-title" href="{{ url_for('post_detail', post_id=post.id) }}">
              {{ post.title }}
            </a>
          </h2>

          <!-- Post image (only if exists) -->
          {% if post.image_file %}
            <div class="mb-3">
              <img src="{{ url_for('static', path='profile_pics/' + post.image_file) }}"
                   alt="Image for {{ post.title }}"
                   class="img-fluid rounded-3"
                   style="max-height: 320px; object-fit: cover; width: 100%;"
                   loading="lazy">
            </div>
          {% endif %}

          <p class="article-content mb-0">{{ post.content }}</p>
        </div>
      </div>
    </article>
  {% endfor %}
{% endblock content %}
